<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-card { background: #1e1e1e; width: 100%; max-width: 400px; height: 600px; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #2b2b2b; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
        .content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .hidden { display: none !important; }
        input, button { width: 100%; padding: 10px; border-radius: 6px; border: none; outline: none; margin-top: 5px; }
        input { background: #2b2b2b; color: #fff; }
        button { background: #ffca28; color: #000; font-weight: bold; cursor: pointer; }
        .msg { background: #333; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .msg.me { background: #ffca28; color: #000; align-self: flex-end; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">Student Chat</div>
    
    <!-- หน้า Auth -->
    <div id="authView" class="content">
        <h3>เข้าสู่ระบบ</h3>
        <input type="text" id="username" placeholder="ใส่ชื่อของคุณ...">
        <button onclick="login()">เข้าใช้งาน</button>
    </div>

    <!-- หน้า Chat -->
    <div id="chatView" class="content hidden">
        <div id="messages" style="flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto;"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="messageInput" placeholder="พิมพ์ข้อความ...">
            <button onclick="sendMessage()" style="width: auto;">ส่ง</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚠️ นำค่าจากหน้าคอนโซล Firebase ของคุณมาวางตรงนี้แทนที่ค่าเดิม
    const firebaseConfig = {
        apiKey: "AIzaSyDaN-eSOQve7qn8MPHcOj4IeYWrt-7SwHk",
        authDomain: "xdhi13.firebaseapp.com",
        databaseURL: "https://xdhi13-default-rtdb.firebaseio.com",
        projectId: "xdhi13",
        storageBucket: "xdhi13.firebasestorage.app",
        messagingSenderId: "1094865586143",
        appId: "1:1094865586143:web:6f1a7e79780ae918eba66a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentUser = "";

    window.login = function() {
        const user = document.getElementById("username").value.trim();
        if(!user) return alert("โปรดระบุชื่อ");
        currentUser = user;
        document.getElementById("authView").classList.add("hidden");
        document.getElementById("chatView").classList.remove("hidden");
        loadMessages();
    }

    window.sendMessage = function() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if(!text) return;
        push(ref(db, "chats/"), { user: currentUser, text: text });
        input.value = "";
    }

    function loadMessages() {
        const msgsDiv = document.getElementById("messages");
        onChildAdded(ref(db, "chats/"), (snapshot) => {
            const data = snapshot.val();
            const div = document.createElement("div");
            div.className = `msg ${data.user === currentUser ? 'me' : ''}`;
            div.innerText = `${data.user}: ${data.text}`;
            msgsDiv.appendChild(div);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;
        });
    }
</script>

</body>
</html>
